name: Verify Mizan Full-Stack Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Restore original Mizan bundle
        run: npm run build

      - name: Verify original bundle checksum
        run: |
          test -s server/index.js
          grep -q "ميزان — المحفظة الاستثمارية" server/index.js
          ! grep -q "localStorage" server/index.js
          grep -q "sessionStorage" server/index.js

      - name: Validate Cloudflare Worker build
        run: npx wrangler deploy --dry-run --outdir dist-worker

      - name: Verify Worker output
        run: |
          test -d dist-worker
          test "$(find dist-worker -type f | wc -l)" -gt 0
