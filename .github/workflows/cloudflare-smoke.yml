name: Smoke Test Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare auto deploy
        run: sleep 25

      - name: Verify private demo sessions and live data
        run: |
          set -e
          URL="https://mizan-portfolio-manager.rahman-raafat.workers.dev"

          for i in {1..8}; do
            curl -L --max-time 60 -fsS "$URL/" -o /tmp/page.html || true
            curl -L --max-time 60 -fsS "$URL/app.js" -o /tmp/app.js || true
            curl -L --max-time 60 -fsS "$URL/allocation-planner.mjs" -o /tmp/allocation.mjs || true
            if grep -q "كل جلسة مستقلة وخاصة بهذا التبويب" /tmp/page.html 2>/dev/null &&                grep -q "sessionStorage.getItem('mizan-v2')" /tmp/app.js 2>/dev/null &&                grep -q "if(hasSavedSession){render();refresh();}else loadDemo();" /tmp/app.js 2>/dev/null; then
              break
            fi
            sleep 10
          done

          grep -q "كل جلسة مستقلة وخاصة بهذا التبويب" /tmp/page.html
          grep -q "تغييراتك خاصة بهذه الجلسة ولا تظهر لأي مستخدم آخر" /tmp/page.html
          grep -q "sessionStorage.getItem('mizan-v2')" /tmp/app.js
          grep -q "sessionStorage.setItem('mizan-v2'" /tmp/app.js
          ! grep -q "localStorage.getItem('mizan-v2')" /tmp/app.js
          grep -q "sessionStorage.getItem('mizan-brokers')" /tmp/app.js
          grep -q "sessionStorage.getItem('mizan-target-weights')" /tmp/allocation.mjs
          grep -q "if(hasSavedSession){render();refresh();}else loadDemo();" /tmp/app.js

          API_STATUS=$(curl -sS --max-time 90 -o /tmp/fx.json -w "%{http_code}"             -H "content-type: application/json"             -d '{"market":"fx","symbol":"USD"}' "$URL/api/price")
          echo "FX_PRICE_HTTP=$API_STATUS"
          test "$API_STATUS" = "200"

          echo "Private-session production smoke test passed."
