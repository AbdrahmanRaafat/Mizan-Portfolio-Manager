name: Smoke Test Cloudflare Production

on:
  push:
    paths:
      - 'worker-entry.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for new production version
        run: |
          URL="https://mizan-portfolio-manager.rahman-raafat.workers.dev"
          for i in {1..24}; do
            code=$(curl -L --max-time 30 -sS -o /tmp/app.js -w "%{http_code}" "$URL/app.js" || true)
            core_code=$(curl -L --max-time 30 -sS -o /tmp/core.mjs -w "%{http_code}" "$URL/core.mjs" || true)
            if [ "$code" = "200" ] && [ "$core_code" = "200" ]               && grep -q "demoVersion:2" /tmp/app.js               && grep -q "demoVersion:Number.isInteger" /tmp/core.mjs; then
              echo "New demo migration version is live."
              exit 0
            fi
            echo "Waiting for Cloudflare deployment... attempt $i"
            sleep 10
          done
          echo "New version did not become live in time."
          exit 1

      - name: Test demo-compatible live APIs
        run: |
          URL="https://mizan-portfolio-manager.rahman-raafat.workers.dev"

          PAGE_STATUS=$(curl -L --max-time 60 -sS -o /tmp/page.html -w "%{http_code}" "$URL/" || true)
          echo "PAGE_STATUS=$PAGE_STATUS"
          test "$PAGE_STATUS" = "200"
          grep -q "المعاملات والأرصدة الابتدائية تجريبية فقط" /tmp/page.html

          PRICE_STATUS=$(curl -sS --max-time 60 -o /tmp/price.json -w "%{http_code}"             -H "content-type: application/json"             -d '{"market":"fx","symbol":"USD","type":"sell","refresh":true}'             "$URL/api/price" || true)
          echo "PRICE_STATUS=$PRICE_STATUS"
          test "$PRICE_STATUS" = "200"
          grep -q '"priceEGP"' /tmp/price.json

          for spec in             'COMI|{"market":"eg","symbol":"COMI","start":"2026-06-01","end":"2026-09-01","currency":"EGP"}'             'AAPL|{"market":"us","symbol":"AAPL","start":"2026-06-01","end":"2026-09-01","currency":"EGP"}'             'USD|{"market":"fx","symbol":"USD","start":"2026-06-01","end":"2026-09-01","currency":"EGP"}'
          do
            name="${spec%%|*}"
            body="${spec#*|}"
            code=$(curl -sS --max-time 60 -o "/tmp/$name.json" -w "%{http_code}"               -H "content-type: application/json" -d "$body" "$URL/api/history" || true)
            echo "$name HISTORY_STATUS=$code"
            test "$code" = "200"
            grep -q '"rows":\[' "/tmp/$name.json"
          done

          echo "Production demo migration and live-data smoke test passed."
