name: Smoke Test Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare auto deploy
        run: sleep 20

      - name: Test production demo, live prices, history and assets
        run: |
          set -e
          URL="https://mizan-portfolio-manager.rahman-raafat.workers.dev"

          for i in {1..6}; do
            curl -L --max-time 60 -fsS "$URL/" -o /tmp/page.html &&             curl -L --max-time 60 -fsS "$URL/app.js" -o /tmp/app.js &&             curl -L --max-time 60 -fsS "$URL/analysis-ui.mjs" -o /tmp/analysis.mjs &&             grep -q "بيانات المحفظة والمعاملات تجريبية فقط" /tmp/page.html &&             ! grep -q "ابدئي محفظة فعلية أولًا لتفعيل بيانات المصدر" /tmp/app.js &&             ! grep -q "اخرجي من البيانات التجريبية لتحليل معاملات فعلية" /tmp/analysis.mjs && break
            sleep 10
          done

          grep -q "بيانات المحفظة والمعاملات تجريبية فقط" /tmp/page.html
          ! grep -q "ابدئي محفظة فعلية أولًا لتفعيل بيانات المصدر" /tmp/app.js
          ! grep -q "اخرجي من البيانات التجريبية لتحليل معاملات فعلية" /tmp/analysis.mjs

          test_api () {
            name="$1"; endpoint="$2"; body="$3"
            code=$(curl -sS --max-time 90 -o "/tmp/$name.json" -w "%{http_code}"               -H "content-type: application/json" -d "$body" "$URL$endpoint")
            echo "$name HTTP=$code"
            cat "/tmp/$name.json" | head -c 500
            echo
            test "$code" = "200"
          }

          test_api fx_price /api/price '{"market":"fx","symbol":"USD"}'
          test_api gold_price /api/price '{"market":"gold","symbol":"GOLD/EGP","karat":24}'
          test_api eg_price /api/price '{"market":"eg","symbol":"COMI"}'
          test_api us_price /api/price '{"market":"us","symbol":"AAPL"}'

          test_api eg_history /api/history '{"market":"eg","symbol":"COMI","start":"2026-01-06","end":"2026-09-20","currency":"EGP"}'
          test_api us_history /api/history '{"market":"us","symbol":"AAPL","start":"2026-01-06","end":"2026-09-20","currency":"EGP"}'
          test_api fx_history /api/history '{"market":"fx","symbol":"USD","start":"2026-01-06","end":"2026-09-20","currency":"EGP"}'

          echo "Full demo/live-data smoke test passed."
