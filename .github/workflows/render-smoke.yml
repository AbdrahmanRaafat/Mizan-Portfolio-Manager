name: Check Render Public URL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Render URL
        run: |
          URL="https://mizan-portfolio-manager.onrender.com/"
          echo "Testing $URL"
          STATUS=$(curl -L --max-time 120 --retry 3 --retry-delay 10 -sS -o /tmp/page.html -w "%{http_code}" "$URL" || true)
          echo "HTTP_STATUS=$STATUS"
          head -c 500 /tmp/page.html || true
          echo
          test "$STATUS" = "200"
          grep -q "ميزان — المحفظة الاستثمارية" /tmp/page.html
